<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>GuRis — 플레이하는 포트폴리오</title>
<meta name="description" content="걸어 다니며 구경하는 인디 게임 개발자 포트폴리오">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
  :root{--ink:#14121f;--paper:#fff8ec;--accent:#ff5d73}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#14121f;color:var(--paper);font-family:'Galmuri11','Galmuri9',system-ui,sans-serif}
  canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated;touch-action:none}
  button{font:inherit;cursor:pointer}
  .hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
  .hud>*{pointer-events:auto}
  .chip{background:rgba(20,18,31,.78);border:2px solid var(--paper);padding:6px 10px;font-size:13px;box-shadow:3px 3px 0 #000}
  .hud-r{display:flex;gap:8px}
  .hud-r button{background:var(--paper);color:var(--ink);border:2px solid var(--ink);padding:6px 10px;font-size:13px;box-shadow:3px 3px 0 #000}
  .hud-r button:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
  #toast{position:fixed;top:64px;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .5s;z-index:4;text-shadow:2px 2px 0 #000}
  #toast.on{opacity:1}
  #toast b{display:block;font-size:24px;letter-spacing:2px}
  #toast span{font-size:13px;opacity:.85}
  #intro{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,8,20,.55);z-index:8;text-align:center;padding:20px;cursor:pointer}
  #intro h1{font-size:clamp(30px,7vw,64px);letter-spacing:3px;text-shadow:4px 4px 0 var(--accent),8px 8px 0 #000}
  #intro p{font-size:15px;opacity:.9}
  #intro .blink{animation:blink 1s steps(2) infinite;margin-top:10px;font-size:17px}
  #intro .keys{font-size:12px;opacity:.75;line-height:1.9}
  kbd{border:1px solid currentColor;padding:0 5px;margin:0 2px}
  @keyframes blink{50%{opacity:0}}
  .backdrop{position:fixed;inset:0;background:rgba(8,6,16,.7);display:flex;align-items:center;justify-content:center;z-index:10;padding:16px}
  .backdrop[hidden]{display:none}
  .card{background:var(--paper);color:var(--ink);border:3px solid var(--ink);box-shadow:8px 8px 0 #000;max-width:640px;width:100%;max-height:88vh;overflow:auto;position:relative;padding:22px}
  .card .x{position:absolute;top:10px;right:10px;background:var(--ink);color:var(--paper);border:0;width:32px;height:32px;font-size:16px}
  .media{aspect-ratio:16/9;border:3px solid var(--ink);margin-bottom:16px;background:#222;overflow:hidden}
  .media img,.media iframe{width:100%;height:100%;object-fit:cover;border:0;display:block}
  .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,var(--c1),var(--c1) 14px,var(--c2) 14px,var(--c2) 28px);color:#fff;font-size:13px;text-shadow:1px 1px 0 #000}
  .tag{display:inline-block;background:var(--g,var(--accent));color:#fff;padding:3px 8px;font-size:12px;margin-bottom:8px}
  .card h2{font-size:26px;margin-bottom:4px}
  .sub{font-size:14px;opacity:.75;margin-bottom:14px}
  .meta{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin-bottom:14px}
  .meta li{border:2px solid var(--ink);padding:3px 8px;font-size:12px}
  .meta b{margin-right:6px;opacity:.6;font-weight:normal}
  .card p.desc{font-size:14px;line-height:1.8;margin-bottom:12px}
  .feat{font-size:13px;line-height:1.8;padding-left:18px;margin-bottom:16px}
  .links{display:flex;flex-wrap:wrap;gap:8px}
  .links a,.links span{border:2px solid var(--ink);padding:7px 12px;font-size:13px;text-decoration:none;color:var(--paper);background:var(--ink);box-shadow:3px 3px 0 var(--g,var(--accent))}
  .links span{background:transparent;color:var(--ink);opacity:.45;box-shadow:none}
  #list .card{max-width:960px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:14px}
  .gc{border:3px solid var(--ink);background:#fff;text-align:left;padding:0;color:var(--ink)}
  .gc .media{border:0;border-bottom:3px solid var(--ink);margin:0}
  .gc div.t{padding:10px 12px}
  .gc h3{font-size:16px;margin:4px 0}
  .gc small{font-size:12px;opacity:.7}
  .touch{position:fixed;bottom:18px;left:0;right:0;display:none;justify-content:space-between;padding:0 18px;z-index:6;pointer-events:none}
  .touch>div{display:flex;gap:12px;pointer-events:auto}
  .touch button{width:64px;height:64px;border-radius:50%;background:rgba(255,248,236,.22);border:2px solid rgba(255,248,236,.75);color:#fff;font-size:20px;touch-action:none;-webkit-user-select:none;user-select:none}
  .touch button.on{background:rgba(255,248,236,.5)}
  @media (pointer:coarse){.touch{display:flex}}
</style>
</head>

<div id="toast"><b></b><span></span></div>

<div id="intro">

  <p class="blink">▶ 아무 키나 누르거나 화면을 터치하세요</p>
  <p class="keys">출시작 2개 · 개발 중 2개<br><kbd>←</kbd><kbd>→</kbd> 이동 · <kbd>Space</kbd> 점프 · <kbd>E</kbd>/<kbd>↑</kbd> 살펴보기 · <kbd>L</kbd> 목록</p>
</div>

<div class="backdrop" id="modal" hidden><div class="card" role="dialog" aria-modal="true"><button class="x" aria-label="닫기">✕</button><div id="modalBody"></div></div></div>
<div class="backdrop" id="list" hidden><div class="card"><button class="x" aria-label="닫기">✕</button><div id="listBody"></div></div></div>

<div class="touch" id="touch">

}

  S = Math.min(cv.height / 270, cv.width / (cv.width < cv.height ? 220 : 300));
  VW = cv.width / S; VH = cv.height / S; OY = VH - 270;
}

const P = { x: 190, y: GROUND - 26, w: 14, h: 26, vx: 0, vy: 0, on: false, face: 1, t: 0, safeX: 190, coy: 0, buf: 0 };
const SPEED = 2.6, JUMP = 8.4, GRAV = 0.45;
const keys = {}, touch = { l: false, r: false };
let camX = 0, started = false, paused = false, time = 0, zoneNow = null, near = null;
const parts = [];
const ov = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

// --- 사운드 (아주 작은 효과음) ---
let ac = null, soundOn = true;
function beep(f, d = .08, type = 'square', v = .05) {
  if (!soundOn) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.value = f; g.gain.value = v;
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + d);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + d);
  } catch (e) {}
}

function puff(x, y, n, c, spd = 1.5, g = .05) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - .5) * spd * 2, vy: -Math.random() * spd, life: 30 + Math.random() * 20, c, g });
}

function update() {
  time++;
  if (paused) return;
  const dir = started ? ((keys.ArrowRight || keys.KeyD || touch.r ? 1 : 0) - (keys.ArrowLeft || keys.KeyA || touch.l ? 1 : 0)) : 0;
  P.vx += (dir * SPEED - P.vx) * .35;
  if (dir) P.face = dir;
  P.coy = P.on ? 6 : P.coy - 1;
  if (P.buf > 0) {
    if (P.coy > 0) { P.vy = -JUMP; P.on = false; P.coy = 0; P.buf = 0; beep(520, .1); puff(P.x + 7, P.y + P.h, 5, '#fff8'); }
    else P.buf--;
  }
  const held = keys.Space || keys.KeyZ || keys.KeyW || keys.ArrowUp || touch.jump;
  if (P.vy < 0 && !held) P.vy += GRAV;
  P.vy = Math.min(P.vy + GRAV, 9);

  // X 이동 (낮은 턱은 자동으로 올라감)
  P.x += P.vx;
  for (const s of solids) if (ov(P, s)) {
    const feet = P.y + P.h;
    if (P.on && s.y >= feet - 9 && s.y < feet) { P.y = s.y - P.h; continue; }
    if (P.vx > 0) P.x = s.x - P.w; else if (P.vx < 0) P.x = s.x + s.w;
  }
  P.x = Math.max(0, Math.min(WORLD - P.w, P.x));
  // Y 이동
  const wasOn = P.on, vyPrev = P.vy;
  P.y += P.vy; P.on = false;
  for (const s of solids) if (ov(P, s)) {
    if (P.vy > 0) { P.y = s.y - P.h; P.vy = 0; P.on = true; }
    else if (P.vy < 0) { P.y = s.y + s.h; P.vy = 0; }
  }
  if (P.on && !wasOn && vyPrev > 4) puff(P.x + 7, P.y + P.h, 6, '#fff8');
  if (P.on && Math.abs(P.vx) < .5 || P.on && time % 20 === 0) P.safeX = P.x;
  if (P.on) {
    const ahead = { x: P.x - 20, y: P.y + P.h, w: P.w + 40, h: 4 };
    if (solids.filter(s => ov(ahead, s)).length && !isNearGap(P.x)) P.safeX = P.x;
  }
  if (P.y > 300) { // 물에 빠짐
    puff(P.x + 7, 230, 18, zoneNow && zoneNow.id === 'sea' ? '#bfefff' : '#8a6a4a', 2.5, .12); beep(180, .25, 'sawtooth', .04);
    P.x = P.safeX; P.y = GROUND - 60; P.vy = 0; P.vx = 0;
  }
  P.t += P.on ? Math.abs(P.vx) * .12 : 0;

  for (const c of coins) if (!c.got && Math.abs(P.x + 7 - c.x) < 12 && Math.abs(P.y + 13 - c.y) < 18) {
    c.got = true; puff(c.x, c.y, 10, '#ffd84a', 2); beep(880, .07); setTimeout(() => beep(1320, .1), 70); hud();
    if (coins.every(c => c.got)) toast("★ 전부 모았어요!", "끝까지 구경해 줘서 고마워요");
  }
  near = spots.find(s => P.x + P.w > s.x - 4 && P.x < s.x + s.w + 4 && P.y + P.h > s.y && P.y < s.y + s.h + 4) || null;

  const z = ZONES.find(z => P.x + 7 >= z.x0 && P.x + 7 < z.x1);
  if (z !== zoneNow) { if (zoneNow && started) toast(z.name, z.sub); zoneNow = z; }

  const target = P.x + 7 - VW * .4;
  camX += (target - camX) * .1;
  camX = Math.max(0, Math.min(Math.max(0, WORLD - VW), camX));

  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += p.g; if (--p.life <= 0) parts.splice(i, 1); }
}
function isNearGap(x) { return GAPS.some(([a, b]) => x > a - 30 && x < b + 30); }

}
function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

  const dark = { mine: 'rgba(8,4,2,.6)', sea: 'rgba(4,8,30,.35)' }[id];
  if (dark) {
    const px = P.x + 7 - camX, py = P.y + 10, g = ctx.createRadialGradient(px, py, 24, px, py, 170);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, dark); ctx.fillStyle = g; ctx.fillRect(sx0, -OY, sx1 - sx0, 300 + OY);
  }
}
function bubble(s) {
  const x = s.x + s.w / 2, y = s.y - 14 + Math.sin(time * .1) * 1.5;
  const coarse = matchMedia('(pointer:coarse)').matches, t = (coarse ? 'E 버튼 · ' : 'E · ') + s.label;
  ctx.font = '8px Galmuri11, sans-serif'; const w = ctx.measureText(t).width + 12;
  R(x - w / 2, y - 7, w, 14, '#fff8ec'); R(x - w / 2, y + 7, w, 1, '#14121f'); R(x - 2, y + 7, 4, 3, '#fff8ec');
  txt(t, x, y + 1, 8, '#14121f');
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.setTransform(S, 0, 0, S, 0, OY * S); ctx.imageSmoothingEnabled = false;
  const cx = Math.round(camX * S) / S;
  for (const z of ZONES) {
    const sx0 = Math.max(0, z.x0 - cx), sx1 = Math.min(VW, z.x1 - cx);
    if (sx1 <= sx0) continue;
    ctx.save(); ctx.beginPath(); ctx.rect(sx0, -OY, sx1 - sx0, 300 + OY); ctx.clip();
    sky(z.id, sx0, sx1);
    if (z.id === 'mine') R(sx0, 226, sx1 - sx0, 80, '#070403');
    if (z.id === 'sea') { R(sx0, 228, sx1 - sx0, 80, '#2b8fc9'); for (let x = sx0 - (time % 16); x < sx1; x += 16) R(x, 228 + Math.sin((x + cx + time) * .1), 8, 2, '#8fdcff'); }
    ctx.translate(-cx, 0);
    props(z.id); ground(z.id);
    ctx.restore();
  }
  ctx.save(); ctx.translate(-cx, 0);
  for (const c of coins) if (!c.got) drawCoin(c);
  drawPlayer();
  for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life / 20); R(p.x, p.y, 2, 2, p.c); } ctx.globalAlpha = 1;
  ctx.restore();
  for (const z of ZONES) {
    const sx0 = Math.max(0, z.x0 - cx), sx1 = Math.min(VW, z.x1 - cx); if (sx1 <= sx0) continue;
    ctx.save(); ctx.beginPath(); ctx.rect(sx0, -OY, sx1 - sx0, 300 + OY); ctx.clip(); overlay(z.id, sx0, sx1); ctx.restore();
  }
  if (near && !paused && started) { ctx.save(); ctx.translate(-cx, 0); bubble(near); ctx.restore(); }
}

function loop() { update(); render(); requestAnimationFrame(loop); }

/* =====================================================================
   5) UI
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function hud() { $('hudL').textContent = `★ ${coins.filter(c => c.got).length}/${coins.length}`; }
let toastT; function toast(a, b) { const t = $('toast'); t.querySelector('b').textContent = a; t.querySelector('span').textContent = b; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }

function media(g, c1 = '#333', c2 = '#444') {
  if (g.youtube) return `<div class="media"><iframe src="https://www.youtube.com/embed/${esc(g.youtube)}" allowfullscreen title="트레일러"></iframe></div>`;
  if (g.image) return `<div class="media"><img src="${esc(g.image)}" alt="${esc(g.title || '')}"></div>`;
  return `<div class="media"><div class="ph" style="--c1:${c1};--c2:${c2}"><span>스크린샷 · 트레일러 자리</span></div></div>`;
}
const links = ls => `<div class="links">${ls.map(l => l.url ? `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a>` : `<span>${esc(l.label)} · 준비 중</span>`).join('')}</div>`;
function gameHTML(g) {
  return `<div style="--g:${g.color}">${media(g, g.color, '#222')}<span class="tag">${esc(g.genre)}</span><h2>${esc(g.title)}</h2><p class="sub">${esc(g.tagline)}</p>
  <ul class="meta"><li><b>상태</b>${esc(g.status)}</li>${g.platform ? `<li><b>플랫폼</b>${esc(g.platform)}</li>` : ''}${g.engine ? `<li><b>엔진</b>${esc(g.engine)}</li>` : ''}</ul>
  <p class="desc">${esc(g.description)}</p><ul class="feat">${g.features.map(f => `<li>${esc(f)}</li>`).join('')}</ul>${links(g.links)}</div>`;
}
function aboutHTML() {
  const a = CONFIG.about;
  return `${a.photo ? `<div class="media" style="aspect-ratio:1;max-width:160px"><img src="${esc(a.photo)}" alt=""></div>` : ''}<span class="tag">ABOUT ME</span><h2>${esc(a.name)}</h2><p class="sub">${esc(a.role)}</p>
  <p class="desc">${esc(a.bio)}</p><ul class="meta">${a.skills.map(s => `<li>${esc(s)}</li>`).join('')}</ul>${links(CONFIG.contact)}`;
}
const contactHTML = () => `<span class="tag">CONTACT</span><h2>연락하기</h2><p class="sub">협업 · 문의 · 피드백 모두 환영해요</p>${links(CONFIG.contact)}`;

function openModal(html) { $('modalBody').innerHTML = html; $('modal').hidden = false; paused = true; $('modal').querySelector('.x').focus(); beep(660, .08, 'triangle'); }
function closeAll() { $('modal').hidden = true; $('list').hidden = true; paused = false; for (const k in keys) keys[k] = false; }
function interact() {
  if (!near || paused) return;
  if (near.kind === 'game') openModal(gameHTML(CONFIG.games[near.id]));
  else if (near.kind === 'about') openModal(aboutHTML());
  else if (near.kind === 'contact') openModal(contactHTML());
  else if (near.kind === 'restart') { puff(P.x + 7, P.y + 10, 20, '#b9a6ff', 2.5); beep(440, .15, 'triangle'); P.x = P.safeX = 190; P.y = GROUND - 60; P.vy = 0; camX = 0; }
}
function openList() {
  const gs = Object.entries(CONFIG.games);
  $('listBody').innerHTML = `<span class="tag">PORTFOLIO</span><h2>${esc(CONFIG.studio)}</h2><p class="sub">${esc(CONFIG.about.role)} · 게임 ${gs.length}개</p>
  <div class="grid">${gs.map(([id, g]) => `<button class="gc" data-g="${id}">${media(g, g.color, '#222')}<div class="t"><small>${esc(g.genre)}</small><h3>${esc(g.title)}</h3><small>${esc(g.status)}</small></div></button>`).join('')}
  <button class="gc" data-a="1"><div class="t"><small>ABOUT</small><h3>${esc(CONFIG.about.name)}</h3><small>소개 · 연락처</small></div></button></div>`;
  $('list').hidden = false; paused = true;
}
$('listBody').addEventListener('click', e => {
  const b = e.target.closest('.gc'); if (!b) return;
  $('list').hidden = true; openModal(b.dataset.g ? gameHTML(CONFIG.games[b.dataset.g]) : aboutHTML());
});
document.querySelectorAll('.backdrop').forEach(b => b.addEventListener('click', e => { if (e.target === b || e.target.classList.contains('x')) closeAll(); }));
$('btnList').onclick = () => { start(); openList(); };
$('btnSound').onclick = () => { soundOn = !soundOn; $('btnSound').textContent = soundOn ? '♪ ON' : '♪ OFF'; };

function start() { if (started) return; started = true; $('intro').style.display = 'none'; toast(ZONES[0].name, CONFIG.studio); beep(660, .1); }
$('intro').addEventListener('pointerdown', start);

addEventListener('keydown', e => {
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) e.preventDefault();
  if (!started) { start(); return; }
  if (e.code === 'Escape') { closeAll(); return; }
  if (!$('modal').hidden || !$('list').hidden) return;
  keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'KeyL') openList();
  else if (e.code === 'KeyE' || e.code === 'Enter') interact();
  else if (e.code === 'ArrowUp' && near) interact();
  else if (['Space', 'KeyZ', 'KeyW', 'ArrowUp'].includes(e.code)) P.buf = 8;
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

document.querySelectorAll('#touch button').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); start(); b.classList.add('on');
    if (k === 'jump') { touch.jump = true; P.buf = 8; } else if (k === 'act') interact(); else touch[k] = true; });
  const up = () => { b.classList.remove('on'); if (k === 'jump') touch.jump = false; else if (k !== 'act') touch[k] = false; };
  b.addEventListener('pointerup', up); b.addEventListener('pointercancel', up); b.addEventListener('pointerleave', up);
});

$('introTitle').textContent = CONFIG.studio; $('introSub').textContent = CONFIG.tagline; document.title = `${CONFIG.studio} — 플레이하는 포트폴리오`;
hud(); loop();
</script>
</body>
</html>
